    }
    .copy-hit.first { top: 50.86%; }
    .copy-hit.second { top: 75.72%; }
    .copy-hit:focus-visible {
      outline: 2px solid #a83d64;
      outline-offset: 2px;
    }
    .status {
      position: absolute;
      left: 50%;
      bottom: 2%;
      transform: translateX(-50%);
      padding: 5px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,.94);
      color: #8b3155;
      font-size: 12px;
      box-shadow: 0 1px 5px rgba(0,0,0,.15);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
      white-space: nowrap;
    }
    .status.show { opacity: 1; }
    @media (min-width: 370px) {
      .gift-card { width: min(100vw, 430px); }
    }
  </style>
</head>
<body>
  <main class="gift-card" aria-label="Gift of Love, informasi rekening">
    <button class="copy-hit first" type="button"
      aria-label="Salin nomor rekening BCA 8030861842"
      data-account="8030861842"></button>
    <button class="copy-hit second" type="button"
      aria-label="Salin nomor rekening BCA 8421132755"
      data-account="8421132755"></button>
    <div class="status" role="status" aria-live="polite">Nomor rekening disalin</div>
  </main>
  <script>
    const statusBox = document.querySelector('.status');

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const field = document.createElement('textarea');
          field.value = text;
          field.style.position = 'fixed';
          field.style.opacity = '0';
          document.body.appendChild(field);
          field.focus();
          field.select();
          const ok = document.execCommand('copy');
          field.remove();
          if (!ok) throw new Error('Copy failed');
        }
        statusBox.textContent = 'Nomor rekening disalin: ' + text;
        statusBox.classList.add('show');
        clearTimeout(window.copyNoticeTimer);
        window.copyNoticeTimer = setTimeout(() => statusBox.classList.remove('show'), 1800);
      } catch (error) {
        statusBox.textContent = 'Gagal menyalin. Tekan lama nomor rekening.';
        statusBox.classList.add('show');
      }
    }

    document.querySelectorAll('.copy-hit').forEach(button => {
      button.addEventListener('click', () => copyText(button.dataset.account));
    });
  </script>
</body>
</html>
